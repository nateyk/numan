name: Temporary frontend formatting baseline refresh

on:
  push:
    branches: [ci/normalize-existing-frontend-format]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'nateyk/numan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/normalize-existing-frontend-format
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write resources/
      - name: Save mechanical formatting on isolated branch
        run: |
          git config user.name "numan-format-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): normalize existing Prettier baseline"
            git push origin HEAD:ci/normalize-existing-frontend-format
          fi
