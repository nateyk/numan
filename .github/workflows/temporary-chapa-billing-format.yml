name: Temporary Chapa billing formatting

on:
  push:
    branches: [fix/chapa-subscription-checkout-lifecycle]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'nateyk/numan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/chapa-subscription-checkout-lifecycle
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write resources/js/pages/Billing/history.tsx resources/js/pages/Billing/plans.tsx
      - name: Commit formatting updates to isolated PR branch
        run: |
          git config user.name "numan-billing-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Billing/history.tsx resources/js/pages/Billing/plans.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(billing): align checkout recovery with project Prettier"
            git push origin HEAD:fix/chapa-subscription-checkout-lifecycle
          fi
