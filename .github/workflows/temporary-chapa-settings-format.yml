name: Temporary Chapa settings formatting

on:
  push:
    branches: [feat/admin-chapa-v1-payment-settings]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'nateyk/numan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-chapa-v1-payment-settings
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatters to Chapa settings files
        run: |
          vendor/bin/pint app/Models/ChapaPaymentSetting.php app/Services/ChapaConfiguration.php app/Services/ChapaService.php app/Http/Controllers/Admin/ChapaPaymentSettingsController.php app/Http/Controllers/Marketplace/CheckoutController.php app/Console/Commands/AcceptChapaTestRenewal.php bootstrap/app.php routes/web.php database/migrations/2026_11_17_000001_create_chapa_payment_settings_table.php tests/Feature/Admin/ChapaPaymentSettingsTest.php
          pnpm exec prettier --write resources/js/layouts/admin-layout.tsx resources/js/pages/admin/chapa-settings.tsx
      - name: Commit only the mechanical style changes
        run: |
          git config user.name "numan-chapa-settings-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Models/ChapaPaymentSetting.php app/Services/ChapaConfiguration.php app/Services/ChapaService.php app/Http/Controllers/Admin/ChapaPaymentSettingsController.php app/Http/Controllers/Marketplace/CheckoutController.php app/Console/Commands/AcceptChapaTestRenewal.php bootstrap/app.php routes/web.php database/migrations/2026_11_17_000001_create_chapa_payment_settings_table.php tests/Feature/Admin/ChapaPaymentSettingsTest.php resources/js/layouts/admin-layout.tsx resources/js/pages/admin/chapa-settings.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(chapa): align admin settings with Pint and Prettier"
            git push origin HEAD:feat/admin-chapa-v1-payment-settings
          fi
