name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # 1. CI — Tests + Lint + Build (must pass before deploy)
  # ──────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Pint (PHP lint)
        run: vendor/bin/pint --test

      - name: Build assets
        run: pnpm run build

      - name: Env + Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

  # ──────────────────────────────────────────────
  # 2. Deploy to cPanel (FTP or SSH)
  #    Requires GitHub Secrets — see DEPLOY.md
  # ──────────────────────────────────────────────
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install & Build (for artifact)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Create deploy artifact (exclude dev files)
        run: |
          mkdir -p /tmp/deploy
          rsync -av --progress ./ /tmp/deploy/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='storage/app/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='.ddev' \
            --exclude='NUL'
          # keep storage structure
          mkdir -p /tmp/deploy/storage/app/public /tmp/deploy/storage/framework/{cache,sessions,views} /tmp/deploy/bootstrap/cache
          # tar for faster transfer
          tar -czf /tmp/deploy.tar.gz -C /tmp/deploy .

      # ── Option A: Deploy via FTP (most cPanel hosts) ──
      - name: Deploy via FTP
        if: ${{ secrets.CPANEL_FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftp' }} # ftp or ftps
          local-dir: ./ # deployed via artifact above, but FTP action needs local-dir; we extract tar on server via SSH fallback
          server-dir: ${{ secrets.CPANEL_REMOTE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.ddev/**
            **/NUL

      # ── Option B: Deploy via SSH + rsync (if SSH enabled) ──
      - name: Deploy via SSH (rsync)
        if: ${{ secrets.CPANEL_SSH_HOST != '' }}
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_SSH_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          SOURCE: "/tmp/deploy/"
          TARGET: ${{ secrets.CPANEL_REMOTE_DIR || '~/numan/' }}
          EXCLUDE: ".git/, .github/, node_modules/, tests/, .ddev/, NUL"
          ARGS: "-avz --delete"

      # ── Post-deploy: run migrations, cache, etc. via SSH ──
      - name: Post-deploy via SSH
        if: ${{ secrets.CPANEL_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.CPANEL_REMOTE_DIR || '~/numan' }}
            echo "→ composer install (prod)"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts || composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            echo "→ storage link"
            php artisan storage:link || true
            echo "→ migrate --force"
            php artisan migrate --force
            echo "→ cache"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache || true
            echo "→ permissions"
            chmod -R 775 storage bootstrap/cache || true
            echo "✓ deploy done"

      - name: No deploy secrets — skip
        if: ${{ secrets.CPANEL_FTP_SERVER == '' && secrets.CPANEL_SSH_HOST == '' }}
        run: |
          echo "::warning::No CPANEL_FTP_SERVER or CPANEL_SSH_HOST secrets set — skipping deploy. See DEPLOY.md"
          echo "CI passed, but deploy was skipped. Set secrets to enable auto-deploy."
