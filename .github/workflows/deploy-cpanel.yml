name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. CI — tests must pass before deploy
  # ──────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Pint (PHP lint)
        run: vendor/bin/pint --test

      - name: Build assets
        run: pnpm run build

      - name: Env + Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

  # ──────────────────────────────────────────────
  # 2. Deploy to cPanel over SSH (rsync + artisan)
  #    Configure in GitHub → Settings → Environments → production-numan
  #      Variables: CPANEL_SSH_HOST, CPANEL_SSH_PORT, CPANEL_SSH_USER,
  #                 CPANEL_REMOTE_DIR, ALLOW_INSECURE_HOSTKEY, APP_URL
  #      Secrets:   CPANEL_SSH_KEY, CPANEL_SSH_KNOWN_HOSTS
  # ──────────────────────────────────────────────
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production-numan
    env:
      CPANEL_SSH_HOST: ${{ vars.CPANEL_SSH_HOST || secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USER: ${{ vars.CPANEL_SSH_USER || secrets.CPANEL_SSH_USER }}
      CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
      CPANEL_REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || secrets.CPANEL_REMOTE_DIR || 'numan/' }}
      ALLOW_INSECURE_HOSTKEY: ${{ vars.ALLOW_INSECURE_HOSTKEY || 'false' }}
      APP_URL: ${{ vars.APP_URL || 'https://numan.agrigebeya.com' }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Skip notice (no SSH secrets configured)
        if: env.CPANEL_SSH_HOST == '' || env.CPANEL_SSH_KEY == ''
        run: |
          echo "::warning::Deploy skipped — set CPANEL_SSH_HOST and CPANEL_SSH_KEY in the production-numan environment. See DEPLOY.md"

      - uses: actions/checkout@v7
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''

      - name: Setup PHP 8.4
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup pnpm
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Build production artifact
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Configure SSH
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$CPANEL_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi
          if [ "$ALLOW_INSECURE_HOSTKEY" = "true" ]; then
            echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          fi

      - name: Deploy (rsync)
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        run: |
          rsync -avz --delete \
            -e "ssh -p ${CPANEL_SSH_PORT} -i ~/.ssh/deploy_key ${SSH_OPTS}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.ddev' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='NUL' \
            --exclude='storage/app/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}:${CPANEL_REMOTE_DIR}"

      - name: Post-deploy (artisan)
        if: env.CPANEL_SSH_HOST != '' && env.CPANEL_SSH_KEY != ''
        run: |
          ssh -p "${CPANEL_SSH_PORT}" -i ~/.ssh/deploy_key ${SSH_OPTS} \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" \
            "cd ${CPANEL_REMOTE_DIR} && \
             composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader && \
             php artisan storage:link || true && \
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             chmod -R 775 storage bootstrap/cache || true && \
             echo '✓ deploy complete'"
