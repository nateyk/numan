name: Diagnose cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production-numan
    env:
      CPANEL_SSH_HOST: ${{ vars.CPANEL_SSH_HOST || secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USER: ${{ vars.CPANEL_SSH_USER || secrets.CPANEL_SSH_USER }}
      CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
      CPANEL_REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || secrets.CPANEL_REMOTE_DIR || 'numan/' }}
      ALLOW_INSECURE_HOSTKEY: ${{ vars.ALLOW_INSECURE_HOSTKEY || 'false' }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$CPANEL_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi
          if [ "$ALLOW_INSECURE_HOSTKEY" = "true" ]; then
            echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          fi

      - name: Gather evidence round 3 (read-only)
        run: |
          ssh -p "${CPANEL_SSH_PORT}" -i ~/.ssh/deploy_key ${SSH_OPTS} \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" bash -s <<'EOF'
          D=~/numan
          LOG=$D/storage/logs/laravel.log
          echo "=== A. exception classes ranked (whole log) ==="
          grep -oE '[A-Za-z_\\]+(Exception|Error)[^"]{0,120}' $LOG 2>/dev/null | sort | uniq -c | sort -rn | head -15
          echo "=== B. MissingAppKey / key-length mentions ==="
          grep -ci "No application encryption key" $LOG 2>/dev/null
          grep -ci "incorrect key length\|Unsupported cipher" $LOG 2>/dev/null
          echo "=== C. newest log line head (first 600 chars) ==="
          tail -1 $LOG 2>/dev/null | cut -c1-600; echo
          echo "=== D. APP_KEY shape (no value shown) ==="
          grep "^APP_KEY=" $D/.env 2>/dev/null | awk -F= '{print "len-after-=:", length($0)-8, "| starts-base64:", ($2 ~ /^base64:/ ? "yes" : "no"), "| has-spaces:", ($0 ~ / / ? "yes" : "no"), "| has-quotes:", ($0 ~ /\"/ ? "yes" : "no")}'
          echo "=== E. APP_KEY payload length after 'base64:' ==="
          grep "^APP_KEY=" $D/.env 2>/dev/null | sed 's/^APP_KEY=base64://' | tr -d '" \r\n' | wc -c
          EOF
