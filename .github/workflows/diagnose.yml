name: Diagnose cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production-numan
    env:
      CPANEL_SSH_HOST: ${{ vars.CPANEL_SSH_HOST || secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USER: ${{ vars.CPANEL_SSH_USER || secrets.CPANEL_SSH_USER }}
      CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
      CPANEL_REMOTE_DIR: ${{ vars.CPANEL_REMOTE_DIR || secrets.CPANEL_REMOTE_DIR || 'numan/' }}
      ALLOW_INSECURE_HOSTKEY: ${{ vars.ALLOW_INSECURE_HOSTKEY || 'false' }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$CPANEL_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi
          if [ "$ALLOW_INSECURE_HOSTKEY" = "true" ]; then
            echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          fi

      - name: Gather evidence round 2 (read-only)
        run: |
          ssh -p "${CPANEL_SSH_PORT}" -i ~/.ssh/deploy_key ${SSH_OPTS} \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" bash -s <<'EOF'
          D=~/numan
          echo "=== A. FIRST exception text for latest request (first 1200 chars each) ==="
          RID=$(grep -o '"request_id":"[a-f0-9-]*"' $D/storage/logs/laravel.log 2>/dev/null | tail -1 | cut -d'"' -f4)
          echo "latest-request-id: $RID"
          grep -F "$RID" $D/storage/logs/laravel.log 2>/dev/null | head -4 | cut -c1-1200
          echo "=== B. APP_KEY lines (count + prefix only, value masked) ==="
          grep -c "^APP_KEY=" $D/.env 2>/dev/null
          grep "^APP_KEY=" $D/.env 2>/dev/null | cut -c1-18
          echo "=== C. cached config key/db (is cache stale vs .env?) ==="
          grep -o "'key' => '[^']*'" $D/bootstrap/cache/config.php 2>/dev/null | head -1 | cut -c1-30
          grep -o "'database' => '[^']*'" $D/bootstrap/cache/config.php 2>/dev/null | head -2 | cut -c1-60
          ls -la --time-style=full-iso $D/.env $D/bootstrap/cache/config.php 2>&1
          echo "=== D. log file size + newest entries timestamps ==="
          ls -la --time-style=full-iso $D/storage/logs/ 2>&1
          echo "=== E. artisan boot check (read-only, does app boot?) ==="
          cd $D && php artisan about --only=environment 2>&1 | head -20
          EOF
