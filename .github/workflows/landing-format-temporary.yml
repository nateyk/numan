name: Format landing template changes
on:
  push:
    branches:
      - feat/numan-landing-template-rebuild
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format landing files
        run: |
          pnpm exec prettier --write \
            resources/js/pages/welcome.tsx \
            resources/js/components/landing/landing-journey.tsx \
            resources/js/components/landing/landing-features.tsx \
            resources/js/components/landing/landing-faq.tsx \
            resources/js/components/landing/landing-pricing.tsx \
            resources/js/components/landing/landing-cta.tsx \
            resources/js/components/landing/landing-header.tsx \
            resources/js/components/landing/landing-footer.tsx \
            resources/js/components/landing/landing-hero.tsx
      - name: Commit formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/welcome.tsx resources/js/components/landing/
          if ! git diff --cached --quiet; then
            git commit -m "style(landing): apply project Prettier formatting"
            git push origin HEAD:feat/numan-landing-template-rebuild
          fi
