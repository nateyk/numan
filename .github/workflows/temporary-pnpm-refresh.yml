name: Temporary pnpm vulnerability refresh

on:
  push:
    branches: [ci/pnpm-security-refresh]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'nateyk/numan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/pnpm-security-refresh
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh semver-compatible frontend dependencies
        run: pnpm update
      - name: Apply security patches and dependency overrides
        run: |
          pnpm audit --fix || true
          pnpm install --no-frozen-lockfile
      - name: Commit updated dependency manifest and lockfile
        run: |
          git config user.name "numan-dependency-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh vulnerable pnpm dependencies"
            git push origin HEAD:ci/pnpm-security-refresh
          fi
