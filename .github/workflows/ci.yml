name: CI

# Formatting, ESLint and dependency audits are required checks.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: pcov
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: php artisan wayfinder:generate --with-form
      - run: pnpm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --compact

  mysql-concurrency:
    name: MySQL 8.0 concurrency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: numan_concurrency
          MYSQL_ROOT_PASSWORD: mysql_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysql_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: numan_concurrency
      DB_USERNAME: root
      DB_PASSWORD: mysql_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: cp .env.example .env
      - run: php artisan key:generate
      # Deliberately separate from SQLite RefreshDatabase; each test creates
      # fixtures committed to MySQL and launches two independent PHP workers.
      - run: php artisan test tests/Concurrency --compact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: php artisan wayfinder:generate --with-form
      - run: vendor/bin/pint --test
      - run: pnpm run format:check
      - name: Diagnose admin reconcile Prettier formatting
        if: failure()
        run: |
          pnpm exec prettier --write resources/js/pages/admin/marketplace-payments.tsx
          git diff -- resources/js/pages/admin/marketplace-payments.tsx
      # Lint maintained repository files; exclude bundled tools and disabled workspace UI via eslint.config.js.
      - run: pnpm exec eslint .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: composer install --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
      - run: composer audit
      - run: pnpm audit --audit-level=high
