name: Format mobile landing navigation
on:
  push:
    branches:
      - fix/landing-mobile-navigation-drawer
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format mobile landing header
        run: pnpm exec prettier --write resources/js/components/landing/landing-header.tsx
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/landing/landing-header.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(landing): format mobile navigation drawer"
            git push origin HEAD:fix/landing-mobile-navigation-drawer
          fi
