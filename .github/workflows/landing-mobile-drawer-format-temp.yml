name: Format landing mobile drawer
on:
  push:
    branches:
      - fix/landing-mobile-navigation-drawer
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply project Prettier to updated drawer
        run: pnpm exec prettier --write resources/js/components/landing/landing-header.tsx resources/js/components/ui/sheet.tsx
      - name: Commit formatted source to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/landing/landing-header.tsx resources/js/components/ui/sheet.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(landing): format the reference-aligned mobile drawer"
            git push origin HEAD:fix/landing-mobile-navigation-drawer
          fi
